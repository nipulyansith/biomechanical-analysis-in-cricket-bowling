<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Calibration — PitchIQ</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="api-client.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="assets/css/theme.css" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: { extend: {
      colors: {
        background: "#05070a", surface: "#0b0f17", "surface-high": "#10151f", "surface-highest": "#171d2b",
        border: "#232a3a", primary: "#123a8c", "primary-soft": "#1a4fb4", "on-primary": "#eaf4ff",
        accent: "#2e8fff", "accent-soft": "#5ec8ff", "on-accent": "#04101f",
        red: "#e5484d", "red-soft": "#ff6b6f", blue: "#4fd6ff",
        ink: "#eef3fb", muted: "#8b96a6", faint: "#56607a"
      },
      fontFamily: { headline: ["Space Grotesk"], body: ["Manrope"], label: ["Lexend"] }
    }}
  }
</script>
<style>
  @keyframes fadeInDown { 0% { opacity: 0; transform: translateY(-20px); } 100% { opacity: 1; transform: translateY(0); } }
  @keyframes fadeOutUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-20px); } }
  .animate-in { animation: fadeInDown 0.3s ease-out; }
  .animate-out { animation: fadeOutUp 0.3s ease-in; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .calibration-overlay {
    background: linear-gradient(0deg, rgba(11,20,18,0.75) 0%, rgba(11,20,18,0) 30%, rgba(11,20,18,0) 70%, rgba(11,20,18,0.75) 100%);
  }
  #calibrationViewport { touch-action: none; }
  #calibrationZoomGroup { transform-origin: 0 0; will-change: transform; }
  .zoom-btn {
    width: 40px; height: 40px; border-radius: 9999px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(5,7,10,0.85); border: 1px solid var(--pitch-border);
    color: var(--pitch-text, #eef3fb); backdrop-filter: blur(6px);
  }
  .zoom-btn:disabled { opacity: 0.35; }
</style>
</head>
<body class="bg-background text-ink font-body min-h-[100dvh] flex flex-col">

<header class="pitchiq-header flex justify-between items-center px-6 py-4">
  <a href="dashboard.html" class="flex items-center gap-3">
    <svg class="pitchiq-logo-mark" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="16" cy="16" r="13" fill="currentColor" opacity="0.15"/>
      <circle cx="16" cy="16" r="13" stroke="currentColor" stroke-width="2"/>
      <path d="M8 9c3 3 3 17 0 20M24 9c-3 3-3 17 0 20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <h1 class="text-xl font-bold text-accent-soft font-headline tracking-tight">PitchIQ</h1>
  </a>
  <span class="badge badge--accent">Calibration Mode</span>
</header>

<main class="flex-grow flex flex-col items-center justify-start pt-6 pb-32 px-4 relative">
  <div class="w-full max-w-2xl text-center mb-5">
    <h2 class="font-headline text-2xl md:text-3xl font-bold tracking-tight text-ink">Mark the Stump</h2>
  </div>

  <!-- Calibration Viewport -->
  <div id="calibrationViewport" class="relative w-full max-w-2xl aspect-[4/5] md:aspect-video rounded-3xl overflow-hidden bg-black border border-border shadow-2xl">
    <div id="calibrationZoomGroup" class="absolute inset-0">
      <img id="videoFrame" alt="Uploaded video first frame" class="w-full h-full object-cover" style="display: block;"/>
      <div class="absolute inset-0 calibration-overlay pointer-events-none"></div>

      <!-- TOP MARKER -->
      <div id="topMarker" class="absolute w-6 h-6 z-10" style="touch-action: none; transform: translate(-50%, -50%); pointer-events: none; cursor: grab;">
        <div class="w-6 h-6 rounded-full border-2 border-accent bg-accent/30 flex items-center justify-center shadow-lg">
          <div class="w-1.5 h-1.5 bg-accent rounded-full"></div>
        </div>
        <div class="absolute top-[-24px] left-1/2 -translate-x-1/2 bg-accent text-on-accent font-label text-[10px] px-2 py-0.5 rounded-full font-bold shadow-md whitespace-nowrap pointer-events-none">TOP</div>
      </div>
      <!-- BOTTOM MARKER -->
      <div id="bottomMarker" class="absolute w-6 h-6 z-10" style="touch-action: none; transform: translate(-50%, -50%); pointer-events: none; cursor: grab;">
        <div class="w-6 h-6 rounded-full border-2 border-blue bg-blue/30 flex items-center justify-center shadow-lg">
          <div class="w-1.5 h-1.5 bg-blue rounded-full"></div>
        </div>
        <div class="absolute top-[-24px] left-1/2 -translate-x-1/2 bg-blue text-on-accent font-label text-[10px] px-2 py-0.5 rounded-full font-bold shadow-md whitespace-nowrap pointer-events-none">BOTTOM</div>
      </div>

      <!-- Clickable overlay for point placement / pan -->
      <div id="calibrationCanvas" class="absolute inset-0 cursor-crosshair" data-point="none"></div>
    </div>

    <!-- Zoom controls (viewport-space, not affected by zoom transform) -->
    <div class="absolute bottom-4 right-4 z-20 flex flex-col items-center gap-2">
      <span id="zoomLevelLabel" class="font-label text-[10px] font-bold text-ink bg-surface-high/90 border border-border rounded-full px-2 py-0.5">100%</span>
      <button id="zoomInBtn" class="zoom-btn" title="Zoom in"><span class="material-symbols-outlined text-lg">zoom_in</span></button>
      <button id="zoomOutBtn" class="zoom-btn" title="Zoom out" disabled><span class="material-symbols-outlined text-lg">zoom_out</span></button>
      <button id="zoomResetBtn" class="zoom-btn" title="Reset zoom"><span class="material-symbols-outlined text-lg">restart_alt</span></button>
    </div>
  </div>

  <!-- Instruction Text -->
  <div class="mt-6 px-6 text-center max-w-md">
    <p class="font-body text-base text-ink leading-snug font-medium" id="calibrationInstruction">
      Click on the video to mark the <strong>TOP</strong> of the stump.
    </p>
  </div>

  <!-- Controls -->
  <div class="fixed bottom-20 left-0 right-0 px-6 z-40 flex flex-col gap-3 max-w-xl mx-auto w-full md:relative md:bottom-auto md:mt-8 md:flex-row md:justify-center md:gap-4">
    <div class="flex gap-3 w-full md:w-auto">
      <button id="undoBtn" onclick="undoPoint()" class="btn-secondary h-14 md:h-auto text-sm px-6 py-4 flex items-center justify-center gap-2 flex-1 md:flex-none" title="Undo last point">
        <span class="material-symbols-outlined text-lg">undo</span> Undo
      </button>
      <button id="redoBtn" onclick="redoPoint()" class="btn-secondary h-14 md:h-auto text-sm px-6 py-4 flex items-center justify-center gap-2 flex-1 md:flex-none" title="Redo undone point">
        <span class="material-symbols-outlined text-lg">redo</span> Redo
      </button>
    </div>
    <button id="confirmBtn" onclick="submitCalibration()" class="btn-primary w-full md:w-auto h-14 md:h-auto text-base px-10 py-4 flex items-center justify-center gap-3">
      <span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
      Confirm &amp; Continue
    </button>
  </div>
</main>

<nav class="md:hidden pitchiq-bottom-nav safe-pb flex justify-around items-center px-4 py-3">
  <a class="flex flex-col items-center justify-center text-muted py-1" href="dashboard.html">
    <span class="material-symbols-outlined text-[24px]">space_dashboard</span>
    <span class="font-label text-[10px] font-medium mt-1">Overview</span>
  </a>
  <a class="flex flex-col items-center justify-center text-accent-soft py-1" href="upload.html">
    <span class="material-symbols-outlined text-[24px]">add_circle</span>
    <span class="font-label text-[10px] font-medium mt-1">Upload</span>
  </a>
</nav>

<script src="assets/js/shared.js"></script>
<script>
// Global state
let sessionId = null;
let canvasDims = { width: 0, height: 0 };
let markers = {
    top: { x: 0.5, y: 0.35 },
    bottom: { x: 0.5, y: 0.68 }
};
let nextPointToPlace = 'top';
let isCurrentlyDragging = false;
let draggedMarkerName = null;

// History management for undo/redo
let history = [];
let historyIndex = -1;

function saveState() {
    historyIndex += 1;
    history = history.slice(0, historyIndex);
    history.push({
        markers: JSON.parse(JSON.stringify(markers)),
        nextPointToPlace: nextPointToPlace
    });
    updateHistoryButtons();
}

function undoPoint() {
    if (historyIndex > 0) {
        historyIndex -= 1;
        const state = history[historyIndex];
        markers = JSON.parse(JSON.stringify(state.markers));
        nextPointToPlace = state.nextPointToPlace;
        updateMarkerPositions();
        updateInstructions();
        updateHistoryButtons();
        showNotification('↶ Undone');
    }
}

function redoPoint() {
    if (historyIndex < history.length - 1) {
        historyIndex += 1;
        const state = history[historyIndex];
        markers = JSON.parse(JSON.stringify(state.markers));
        nextPointToPlace = state.nextPointToPlace;
        updateMarkerPositions();
        updateInstructions();
        updateHistoryButtons();
        showNotification('↷ Redone');
    }
}

function updateHistoryButtons() {
    document.getElementById('undoBtn').disabled = historyIndex <= 0;
    document.getElementById('redoBtn').disabled = historyIndex >= history.length - 1;
}

// ── Zoom / pan state ─────────────────────────────────────────────────────
let zoomScale = 1;
let panX = 0, panY = 0;
const ZOOM_MIN = 1, ZOOM_MAX = 4, ZOOM_STEP = 0.5;
let isPanning = false, panStart = null, panMoved = false, panJustHappened = false;

function applyZoomTransform() {
    const group = document.getElementById('calibrationZoomGroup');
    group.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomScale})`;
    document.getElementById('zoomLevelLabel').textContent = Math.round(zoomScale * 100) + '%';
    document.getElementById('zoomOutBtn').disabled = zoomScale <= ZOOM_MIN;
    document.getElementById('zoomInBtn').disabled = zoomScale >= ZOOM_MAX;
}

function clampPan() {
    const viewport = document.getElementById('calibrationViewport');
    const w = viewport.clientWidth, h = viewport.clientHeight;
    const minX = w - w * zoomScale, maxX = 0;
    const minY = h - h * zoomScale, maxY = 0;
    panX = Math.min(maxX, Math.max(minX, panX));
    panY = Math.min(maxY, Math.max(minY, panY));
}

function zoomBy(deltaScale, anchorClientX, anchorClientY) {
    const viewport = document.getElementById('calibrationViewport');
    const rect = viewport.getBoundingClientRect();
    const px = (anchorClientX !== undefined ? anchorClientX - rect.left : rect.width / 2);
    const py = (anchorClientY !== undefined ? anchorClientY - rect.top : rect.height / 2);

    const newScale = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, +(zoomScale + deltaScale).toFixed(2)));
    if (newScale === zoomScale) return;

    // Keep the point under the anchor visually fixed while zooming
    const contentX = (px - panX) / zoomScale;
    const contentY = (py - panY) / zoomScale;
    panX = px - newScale * contentX;
    panY = py - newScale * contentY;
    zoomScale = newScale;
    clampPan();
    applyZoomTransform();
}

function resetZoom() {
    zoomScale = 1; panX = 0; panY = 0;
    applyZoomTransform();
}

document.getElementById('zoomInBtn').addEventListener('click', () => zoomBy(ZOOM_STEP));
document.getElementById('zoomOutBtn').addEventListener('click', () => zoomBy(-ZOOM_STEP));
document.getElementById('zoomResetBtn').addEventListener('click', resetZoom);

const viewportEl = document.getElementById('calibrationViewport');
viewportEl.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = e.deltaY < 0 ? ZOOM_STEP / 2 : -ZOOM_STEP / 2;
    zoomBy(delta, e.clientX, e.clientY);
}, { passive: false });

function panPointerDown(e) {
    if (zoomScale <= 1) return;
    if (e.target.closest('#topMarker') || e.target.closest('#bottomMarker')) return;
    const point = e.touches ? e.touches[0] : e;
    isPanning = true;
    panMoved = false;
    panStart = { x: point.clientX, y: point.clientY, panX, panY };
}
function panPointerMove(e) {
    if (!isPanning || !panStart) return;
    const point = e.touches ? e.touches[0] : e;
    const dx = point.clientX - panStart.x;
    const dy = point.clientY - panStart.y;
    if (!panMoved && Math.hypot(dx, dy) > 4) panMoved = true;
    if (panMoved) {
        panX = panStart.panX + dx;
        panY = panStart.panY + dy;
        clampPan();
        applyZoomTransform();
        e.preventDefault();
    }
}
function panPointerUp() {
    if (isPanning && panMoved) panJustHappened = true;
    isPanning = false;
    panStart = null;
}

// Initialize on page load
document.addEventListener('DOMContentLoaded', async () => {
    const params = new URLSearchParams(window.location.search);
    sessionId = params.get('session');

    if (!sessionId) {
        alert('No session ID provided');
        window.location.href = 'dashboard.html';
        return;
    }

    await loadVideoPreview();

    try {
        const img = document.getElementById('videoFrame');
        const onload = new Promise((resolve) => {
            img.onload = () => {
                canvasDims = { width: img.naturalWidth, height: img.naturalHeight };
                console.log('Video dimensions:', canvasDims);
                resolve();
            };
        });
        await onload;
    } catch (error) {
        console.error('Error getting video dimensions:', error);
    }

    enableClickToPlace();
    updateMarkerPositions();

    const canvasEl = document.getElementById('calibrationCanvas');
    canvasEl.addEventListener('mousedown', panPointerDown);
    canvasEl.addEventListener('touchstart', panPointerDown, { passive: true });
    document.addEventListener('mousemove', panPointerMove);
    document.addEventListener('touchmove', panPointerMove, { passive: false });
    document.addEventListener('mouseup', panPointerUp);
    document.addEventListener('touchend', panPointerUp);

    saveState();
    updateHistoryButtons();
    updateInstructions();
});

async function loadVideoPreview() {
    try {
        const response = await fetch(`/api/calibration/preview/${sessionId}`);
        if (!response.ok) throw new Error(`Failed to load video preview: ${response.statusText}`);

        const blob = await response.blob();
        const url = URL.createObjectURL(blob);

        const img = document.getElementById('videoFrame');
        img.src = url;
        img.style.display = 'block';

        console.log('Video preview loaded successfully');
    } catch (error) {
        console.error('Error loading video preview:', error);
        alert('Failed to load video preview. The calibration page will show instructions instead.');
    }
}

function updateMarkerPositions() {
    const topMarker = document.getElementById('topMarker');
    const bottomMarker = document.getElementById('bottomMarker');

    if (canvasDims.width === 0) return;

    const topX = markers.top.x * 100;
    const topY = markers.top.y * 100;
    const botX = markers.bottom.x * 100;
    const botY = markers.bottom.y * 100;

    topMarker.style.left = topX + '%';
    topMarker.style.top = topY + '%';

    bottomMarker.style.left = botX + '%';
    bottomMarker.style.top = botY + '%';
}

function enableClickToPlace() {
    const canvas = document.getElementById('calibrationCanvas');

    canvas.addEventListener('click', (e) => {
        if (panJustHappened) { panJustHappened = false; return; }
        if (isCurrentlyDragging) return;

        const rect = canvas.parentElement.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width;
        const y = (e.clientY - rect.top) / rect.height;

        const clampedX = Math.max(0, Math.min(1, x));
        const clampedY = Math.max(0, Math.min(1, y));

        if (nextPointToPlace === 'top') {
            markers.top.x = clampedX;
            markers.top.y = clampedY;
            nextPointToPlace = 'bottom';
            showNotification('✓ Top point set. Drag to fine-tune or click bottom point.');
            saveState();
        } else if (nextPointToPlace === 'bottom') {
            markers.bottom.x = clampedX;
            markers.bottom.y = clampedY;
            nextPointToPlace = 'complete';
            showNotification('✓ Bottom point set. Drag to fine-tune or click Confirm.');
            saveState();
        }

        updateMarkerPositions();
        updateInstructions();
        enableMarkerDragging();
    });

    enableMarkerDragging();
}

function enableMarkerDragging() {
    const topMarker = document.getElementById('topMarker');
    const bottomMarker = document.getElementById('bottomMarker');

    topMarker.style.pointerEvents = 'auto';
    bottomMarker.style.pointerEvents = 'auto';

    if (!topMarker.dataset.dragAdded) {
        topMarker.addEventListener('mousedown', startDrag, false);
        topMarker.addEventListener('touchstart', startDrag, false);
        topMarker.dataset.dragAdded = 'true';
    }

    if (!bottomMarker.dataset.dragAdded) {
        bottomMarker.addEventListener('mousedown', startDrag, false);
        bottomMarker.addEventListener('touchstart', startDrag, false);
        bottomMarker.dataset.dragAdded = 'true';
    }

    if (!window.dragListenersAdded) {
        document.addEventListener('mousemove', dragging, false);
        document.addEventListener('touchmove', dragging, false);
        document.addEventListener('mouseup', stopDrag, false);
        document.addEventListener('touchend', stopDrag, false);
        window.dragListenersAdded = true;
    }
}

function startDrag(e) {
    if (nextPointToPlace === 'top') return;

    isCurrentlyDragging = true;
    draggedMarkerName = e.currentTarget.id === 'topMarker' ? 'top' : 'bottom';
    e.currentTarget.style.cursor = 'grabbing';
    e.preventDefault();
    e.stopPropagation();
}

function dragging(e) {
    if (!isCurrentlyDragging || !draggedMarkerName) return;

    const canvas = document.getElementById('calibrationCanvas');
    const rect = canvas.parentElement.getBoundingClientRect();

    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;

    const x = (clientX - rect.left) / rect.width;
    const y = (clientY - rect.top) / rect.height;

    markers[draggedMarkerName].x = Math.max(0, Math.min(1, x));
    markers[draggedMarkerName].y = Math.max(0, Math.min(1, y));

    updateMarkerPositions();
    e.preventDefault();
}

function stopDrag(e) {
    if (isCurrentlyDragging && draggedMarkerName) {
        const marker = document.getElementById(draggedMarkerName === 'top' ? 'topMarker' : 'bottomMarker');
        marker.style.cursor = 'grab';
        showNotification('📍 Point position updated');
        saveState();
    }
    isCurrentlyDragging = false;
    draggedMarkerName = null;
}

function showNotification(message) {
    const notification = document.createElement('div');
    notification.className = 'toast animate-in';
    notification.textContent = message;
    document.body.appendChild(notification);

    setTimeout(() => {
        notification.classList.add('animate-out');
        setTimeout(() => notification.remove(), 300);
    }, 2000);
}

function updateInstructions() {
    const instruction = document.getElementById('calibrationInstruction');
    const confirmBtn = document.getElementById('confirmBtn');

    if (nextPointToPlace === 'top') {
        instruction.innerHTML = 'Click on the video to mark the <strong>TOP</strong> of the stump.';
        confirmBtn.disabled = true;
    } else if (nextPointToPlace === 'bottom') {
        instruction.innerHTML = 'Now click on the video to mark the <strong>BOTTOM</strong> of the stump. You can drag the TOP point to fine-tune.';
        confirmBtn.disabled = true;
    } else if (nextPointToPlace === 'complete') {
        instruction.innerHTML = '✓ Points set! Drag either point to fine-tune, then click <strong>Confirm &amp; Continue</strong>.';
        confirmBtn.disabled = false;
    }
}

async function submitCalibration() {
    try {
        const videoWidth = canvasDims.width || 1920;
        const videoHeight = canvasDims.height || 1080;

        const topPixelX = Math.round(markers.top.x * videoWidth);
        const topPixelY = Math.round(markers.top.y * videoHeight);
        const botPixelX = Math.round(markers.bottom.x * videoWidth);
        const botPixelY = Math.round(markers.bottom.y * videoHeight);

        console.log('=== CALIBRATION SUBMISSION ===');
        console.log('Video dimensions:', { width: videoWidth, height: videoHeight });
        console.log('Normalized coordinates (0-1):');
        console.log('  TOP:', { x: markers.top.x.toFixed(4), y: markers.top.y.toFixed(4) });
        console.log('  BOTTOM:', { x: markers.bottom.x.toFixed(4), y: markers.bottom.y.toFixed(4) });
        console.log('Pixel coordinates (centers):');
        console.log('  TOP:', { x: topPixelX, y: topPixelY });
        console.log('  BOTTOM:', { x: botPixelX, y: botPixelY });
        console.log('Stump distance in pixels:', Math.abs(botPixelY - topPixelY));
        console.log('==============================');

        const calibrationData = {
            top: { x: topPixelX, y: topPixelY },
            bottom: { x: botPixelX, y: botPixelY }
        };

        const response = await fetch(`/api/calibration/${sessionId}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(calibrationData)
        });

        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.error || 'Failed to submit calibration');
        }

        const result = await response.json();
        console.log('Calibration submitted:', result);

        await startProcessing();
    } catch (error) {
        console.error('Calibration error:', error);
        alert('Calibration error: ' + error.message);
    }
}

async function startProcessing() {
    try {
        const response = await fetch(`/api/process/${sessionId}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
        });

        if (!response.ok) throw new Error('Failed to start processing');

        window.location.href = `processing.html?session=${sessionId}`;
    } catch (error) {
        console.error('Processing error:', error);
        alert('Failed to start processing. Please try again.');
    }
}
</script>
</body>
</html>

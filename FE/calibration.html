<script>
// Global state
let sessionId = null;
let canvasDims = { width: 0, height: 0 };
let markers = {
    top: { x: 0.5, y: 0.35 },
    bottom: { x: 0.5, y: 0.68 }
};
let nextPointToPlace = 'top'; // Track which point user should place next
let isCurrentlyDragging = false;
let draggedMarkerName = null;

// History management for undo/redo
let history = [];
let historyIndex = -1;

// Save state to history
function saveState() {
    historyIndex += 1;
    history = history.slice(0, historyIndex); // Remove any redo items
    history.push({
        markers: JSON.parse(JSON.stringify(markers)),
        nextPointToPlace: nextPointToPlace
    });
    updateHistoryButtons();
}

// Undo to previous state
function undoPoint() {
    if (historyIndex > 0) {
        historyIndex -= 1;
        const state = history[historyIndex];
        markers = JSON.parse(JSON.stringify(state.markers));
        nextPointToPlace = state.nextPointToPlace;
        updateMarkerPositions();
        updateInstructions();
        updateHistoryButtons();
        showNotification('↶ Undone');
    }
}

// Redo to next state
function redoPoint() {
    if (historyIndex < history.length - 1) {
        historyIndex += 1;
        const state = history[historyIndex];
        markers = JSON.parse(JSON.stringify(state.markers));
        nextPointToPlace = state.nextPointToPlace;
        updateMarkerPositions();
        updateInstructions();
        updateHistoryButtons();
        showNotification('↷ Redone');
    }
}

// Update undo/redo button states
function updateHistoryButtons() {
    document.getElementById('undoBtn').disabled = historyIndex <= 0;
    document.getElementById('redoBtn').disabled = historyIndex >= history.length - 1;
}

// Initialize on page load
document.addEventListener('DOMContentLoaded', async () => {
    // Get session ID from URL
    const params = new URLSearchParams(window.location.search);
    sessionId = params.get('session');
    
    if (!sessionId) {
        alert('No session ID provided');
        window.location.href = 'dashboard.html';
        return;
    }
    
    // Load video preview and get dimensions
    await loadVideoPreview();
    
    // Get video dimensions for coordinate conversion
    try {
        const img = document.getElementById('videoFrame');
        const onload = new Promise((resolve) => {
            img.onload = () => {
                canvasDims = { width: img.naturalWidth, height: img.naturalHeight };
                console.log('Video dimensions:', canvasDims);
                resolve();
            };
        });
        await onload;
    } catch (error) {
        console.error('Error getting video dimensions:', error);
    }
    
    // Enable click-to-place functionality
    enableClickToPlace();
    
    // Initialize marker positions on screen
    updateMarkerPositions();
    
    // Save initial state for undo/redo
    saveState();
    updateHistoryButtons();
    updateInstructions();
});

// Load video frame from API
async function loadVideoPreview() {
    try {
        const response = await fetch(`/api/calibration/preview/${sessionId}`);
        if (!response.ok) throw new Error(`Failed to load video preview: ${response.statusText}`);
        
        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        
        // Set image source
        const img = document.getElementById('videoFrame');
        img.src = url;
        img.style.display = 'block';
        
        console.log('Video preview loaded successfully');
    } catch (error) {
        console.error('Error loading video preview:', error);
        alert('Failed to load video preview. The calibration page will show instructions instead.');
    }
}

// Update marker visual positions
function updateMarkerPositions() {
    const topMarker = document.getElementById('topMarker');
    const bottomMarker = document.getElementById('bottomMarker');
    
    if (canvasDims.width === 0) return;
    
    // Calculate as percentages for accurate positioning
    const topX = markers.top.x * 100;
    const topY = markers.top.y * 100;
    const botX = markers.bottom.x * 100;
    const botY = markers.bottom.y * 100;
    
    topMarker.style.left = topX + '%';
    topMarker.style.top = topY + '%';
    
    bottomMarker.style.left = botX + '%';
    bottomMarker.style.top = botY + '%';
}

// Enable click-to-place functionality
function enableClickToPlace() {
    const canvas = document.getElementById('calibrationCanvas');
    
    canvas.addEventListener('click', (e) => {
        // Don't place a new point while dragging
        if (isCurrentlyDragging) return;
        
        const rect = canvas.parentElement.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width;
        const y = (e.clientY - rect.top) / rect.height;
        
        // Clamp to bounds
        const clampedX = Math.max(0, Math.min(1, x));
        const clampedY = Math.max(0, Math.min(1, y));
        
        // Place the next point
        if (nextPointToPlace === 'top') {
            markers.top.x = clampedX;
            markers.top.y = clampedY;
            nextPointToPlace = 'bottom';
            showNotification('✓ Top point set. Drag to fine-tune or click bottom point.');
            saveState();
        } else if (nextPointToPlace === 'bottom') {
            markers.bottom.x = clampedX;
            markers.bottom.y = clampedY;
            nextPointToPlace = 'complete';
            showNotification('✓ Bottom point set. Drag to fine-tune or click Confirm.');
            saveState();
        }
        
        updateMarkerPositions();
        updateInstructions();
        enableMarkerDragging();
    });
    
    enableMarkerDragging();
}

// Enable dragging on placed markers for fine-tuning
function enableMarkerDragging() {
    const topMarker = document.getElementById('topMarker');
    const bottomMarker = document.getElementById('bottomMarker');
    
    // Enable pointer events and drag on both markers
    topMarker.style.pointerEvents = 'auto';
    bottomMarker.style.pointerEvents = 'auto';
    
    // Add drag listeners to markers (only add once per marker)
    if (!topMarker.dataset.dragAdded) {
        topMarker.addEventListener('mousedown', startDrag, false);
        topMarker.addEventListener('touchstart', startDrag, false);
        topMarker.dataset.dragAdded = 'true';
    }
    
    if (!bottomMarker.dataset.dragAdded) {
        bottomMarker.addEventListener('mousedown', startDrag, false);
        bottomMarker.addEventListener('touchstart', startDrag, false);
        bottomMarker.dataset.dragAdded = 'true';
    }
    
    // Add global move/drop listeners only once
    if (!window.dragListenersAdded) {
        document.addEventListener('mousemove', dragging, false);
        document.addEventListener('touchmove', dragging, false);
        document.addEventListener('mouseup', stopDrag, false);
        document.addEventListener('touchend', stopDrag, false);
        window.dragListenersAdded = true;
    }
}

// Start dragging a marker
function startDrag(e) {
    if (nextPointToPlace === 'top') return; // Can't drag if we haven't placed top yet
    
    isCurrentlyDragging = true;
    draggedMarkerName = e.currentTarget.id === 'topMarker' ? 'top' : 'bottom';
    e.currentTarget.style.cursor = 'grabbing';
    e.preventDefault();
}

// While dragging
function dragging(e) {
    if (!isCurrentlyDragging || !draggedMarkerName) return;
    
    const canvas = document.getElementById('calibrationCanvas');
    const rect = canvas.parentElement.getBoundingClientRect();
    
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    
    // Calculate normalized position (0-1)
    const x = (clientX - rect.left) / rect.width;
    const y = (clientY - rect.top) / rect.height;
    
    // Clamp to bounds
    markers[draggedMarkerName].x = Math.max(0, Math.min(1, x));
    markers[draggedMarkerName].y = Math.max(0, Math.min(1, y));
    
    updateMarkerPositions();
    e.preventDefault();
}

// Stop dragging
function stopDrag(e) {
    if (isCurrentlyDragging && draggedMarkerName) {
        const marker = document.getElementById(draggedMarkerName === 'top' ? 'topMarker' : 'bottomMarker');
        marker.style.cursor = 'grab';
        showNotification('📍 Point position updated');
        saveState();
    }
    isCurrentlyDragging = false;
    draggedMarkerName = null;
}

// Show temporary notification to user
function showNotification(message) {
    const notification = document.createElement('div');
    notification.className = 'fixed top-20 left-1/2 -translate-x-1/2 bg-tertiary text-on-tertiary px-6 py-3 rounded-full font-label text-sm font-semibold shadow-lg z-50 animate-in fade-in slide-in-from-top';
    notification.textContent = message;
    document.body.appendChild(notification);
    
    setTimeout(() => {
        notification.classList.add('animate-out');
        setTimeout(() => notification.remove(), 300);
    }, 2000);
}

// Update instruction text based on calibration state
function updateInstructions() {
    const instruction = document.getElementById('calibrationInstruction');
    const confirmBtn = document.getElementById('confirmBtn');
    
    if (nextPointToPlace === 'top') {
        instruction.innerHTML = 'Click on the video to mark the <strong>TOP</strong> of the stump.';
        confirmBtn.disabled = true;
    } else if (nextPointToPlace === 'bottom') {
        instruction.innerHTML = 'Now click on the video to mark the <strong>BOTTOM</strong> of the stump. You can drag the TOP point to fine-tune.';
        confirmBtn.disabled = true;
    } else if (nextPointToPlace === 'complete') {
        instruction.innerHTML = '✓ Points set! Drag either point to fine-tune, then click <strong>Confirm & Continue</strong>.';
        confirmBtn.disabled = false;
    }
}

// Submit calibration points
async function submitCalibration() {
    try {
        // Use actual video dimensions if available, otherwise estimate
        const videoWidth = canvasDims.width || 1920;
        const videoHeight = canvasDims.height || 1080;
        
        // Convert NORMALIZED coordinates (0-1) to PIXEL coordinates
        // These represent the CENTER of the marked points
        const topPixelX = Math.round(markers.top.x * videoWidth);
        const topPixelY = Math.round(markers.top.y * videoHeight);
        const botPixelX = Math.round(markers.bottom.x * videoWidth);
        const botPixelY = Math.round(markers.bottom.y * videoHeight);
        
        // Log detailed information for verification
        console.log('=== CALIBRATION SUBMISSION ===');
        console.log('Video dimensions:', { width: videoWidth, height: videoHeight });
        console.log('Normalized coordinates (0-1):');
        console.log('  TOP:', { x: markers.top.x.toFixed(4), y: markers.top.y.toFixed(4) });
        console.log('  BOTTOM:', { x: markers.bottom.x.toFixed(4), y: markers.bottom.y.toFixed(4) });
        console.log('Pixel coordinates (centers):');
        console.log('  TOP:', { x: topPixelX, y: topPixelY });
        console.log('  BOTTOM:', { x: botPixelX, y: botPixelY });
        console.log('Stump distance in pixels:', Math.abs(botPixelY - topPixelY));
        console.log('==============================');
        
        // API expects pixel coordinates
        const calibrationData = {
            top: { x: topPixelX, y: topPixelY },
            bottom: { x: botPixelX, y: botPixelY }
        };
        
        // Submit to API
        const response = await fetch(`/api/calibration/${sessionId}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(calibrationData)
        });
        
        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.error || 'Failed to submit calibration');
        }
        
        const result = await response.json();
        console.log('Calibration submitted:', result);
        
        // Start processing
        await startProcessing();
    } catch (error) {
        console.error('Calibration error:', error);
        alert('Calibration error: ' + error.message);
    }
}

// Start video processing
async function startProcessing() {
    try {
        const response = await fetch(`/api/process/${sessionId}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
        });
        
        if (!response.ok) throw new Error('Failed to start processing');
        
        // Navigate to processing page
        window.location.href = `processing.html?session=${sessionId}`;
    } catch (error) {
        console.error('Processing error:', error);
        alert('Failed to start processing. Please try again.');
    }
}
